name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json claims engines.node >= 18. This matrix is what makes that
        # a verified statement rather than an assumption — if the floor breaks,
        # raise the floor, do not quietly drop the row.
        node: [18, 20, 22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      # The tool checking itself: the reference palette must pass, and the
      # known-bad fixture must fail. A green CI run where these two agree is
      # the only real proof the thresholds still mean anything.
      - name: reference palette passes
        run: node dist/cli.js examples/wong.json --no-color

      - name: known-bad palette fails
        run: |
          if node dist/cli.js examples/rudesync.json --no-color; then
            echo "expected a non-zero exit for the known-bad palette"
            exit 1
          fi
